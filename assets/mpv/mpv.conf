osc=no
osd-bar=no
osd-level=0

border=no

save-position-on-quit=yes

autofit-larger=1600x800
player-operation-mode=pseudo-gui

# Video output & hardware decoding stability (optimized for Linux + NVIDIA)
vo=gpu-next
gpu-api=auto
hwdec=nvdec-copy,nvdec,auto-safe

volume-max=150

sub-auto=fuzzy
sub-font-size=36
sub-border-size=2
sub-shadow-offset=1
